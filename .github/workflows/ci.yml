name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest # the platform AI City runs on; Linux skipped 40 tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Policy self-test
        run: npm run policy:selftest
      - name: Types
        run: npx tsc --noEmit
        working-directory: city
      - name: Tests
        run: npm test
      - name: Install portaudio (pyaudio builds against it)
        run: brew install portaudio
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.6
          enable-cache: false # the pipeline extra is 1.5 GB and installs in about two minutes
      - name: Voice tests
        working-directory: jarvis/voice
        run: |
          uv sync --locked --extra pipeline
          uv run pytest -q -rs
