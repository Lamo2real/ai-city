[project]
name = "jarvis-voice"
version = "0.1.0"
description = "Jarvis's real-time voice loop: a Pipecat client of the shared Jarvis session"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# The real pipeline. Audio in and out, Silero VAD and smart-turn come with `local` and
# `local-smart-turn`; Kokoro and Piper are the offline fallbacks; Cartesia is in core.
pipeline = ["pipecat-ai[local,local-smart-turn,silero,whisper,mlx-whisper,kokoro,piper]==1.15.0"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis_voice"]
